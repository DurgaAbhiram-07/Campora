version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: campora-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: campora_db
    volumes:
      - mongo_data:/data/db
      - ./database/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: campora-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/campora_db
      JWT_SECRET: supersecretcamporasafetyjwtkey998877
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: campora-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
